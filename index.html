<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compendio BIA · Gerencia Departamental de Operaciones</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">BIA</span>
        <div class="brand-text">
          <strong>Compendio de Salidas Críticas</strong>
          <span>Gerencia Departamental de Operaciones</span>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Ocultar índice">‹</button>
    </div>

    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Buscar salida, unidad o aplicativo…" autocomplete="off">
    </div>

    <nav class="tree" id="tree" aria-label="Índice del compendio"></nav>

    <div class="sidebar-foot">
      <a href="#/" class="foot-link">Inicio</a>
      <a href="#/glosario" class="foot-link">Glosario</a>
    </div>
  </aside>

  <button class="sidebar-toggle sidebar-toggle-collapsed" id="sidebarToggleCollapsed" aria-label="Mostrar índice">›</button>

  <!-- ===================== MAIN ===================== -->
  <main class="content" id="content">
    <!-- rendered by js/app.js -->
  </main>

</div>

<script src="js/app.js"></script>
</body>
</html>
